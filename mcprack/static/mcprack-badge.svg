<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <style>
      .badge-primary { fill: #1f2937; }
      .badge-admin { fill: #2563eb; }
      .badge-users { fill: #16a34a; }
      .badge-vault { fill: #9333ea; }
    </style>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="white" stroke="#e5e7eb" stroke-width="2"/>

  <!-- Main shield with MCP -->
  <g transform="translate(100, 100)">
    <!-- Large central hexagon -->
    <polygon points="0,-50 43,-25 43,25 0,50 -43,25 -43,-25" 
             class="badge-primary" opacity="0.15"/>
    
    <!-- Overlapping colored segments representing functions -->
    <!-- Top-left: Admin (Blue) -->
    <polygon points="0,0 -25,-25 -40,-15 -30,0" class="badge-admin" opacity="0.85"/>
    
    <!-- Top-right: Catalog (Green) -->
    <polygon points="0,0 25,-25 40,-15 30,0" class="badge-users" opacity="0.85"/>
    
    <!-- Bottom: Vault (Purple) -->
    <polygon points="0,0 -20,35 0,45 20,35" class="badge-vault" opacity="0.85"/>
    
    <!-- Center circle -->
    <circle r="18" class="badge-primary" opacity="0.9"/>
    <text x="0" y="6" font-family="sans-serif" font-size="12" font-weight="bold" 
          fill="white" text-anchor="middle">MCP</text>
  </g>

  <!-- Label -->
  <text x="100" y="180" font-family="sans-serif" font-size="13" font-weight="600" 
        fill="#374151" text-anchor="middle">mcprack</text>
</svg>
