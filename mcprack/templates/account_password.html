{% extends "base.html" %}
{% block title %}{{ _('Change password') }} — mcprack{% endblock %}
{% block content %}

<div style="max-width: 400px; margin: var(--space-2xl) auto;">
  <div style="text-align: center; margin-bottom: var(--space-2xl);">
    <h1 style="margin-bottom: var(--space-md);">{{ _('Change your password') }}</h1>
  </div>

  <div style="background-color: var(--color-bg-secondary); padding: var(--space-lg); border-radius: var(--border-radius-lg); border: 1px solid var(--color-border);">
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label for="current_password">{{ _('Current password') }}</label>
        <input type="password" id="current_password" name="current_password" required autofocus>
      </div>
      <div class="form-group">
        <label for="new_password">{{ _('New password') }}</label>
        <input type="password" id="new_password" name="new_password" required>
      </div>
      <div class="form-group">
        <label for="confirm_password">{{ _('Confirm new password') }}</label>
        <input type="password" id="confirm_password" name="confirm_password" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: var(--space-lg);">
        {{ _('Change password') }}
      </button>
    </form>
  </div>
</div>

{% endblock %}
