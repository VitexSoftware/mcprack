{% extends "base.html" %}
{% block title %}{{ _('Two-factor authentication') }} — mcprack{% endblock %}
{% block content %}

<div class="auth-card">
  <div class="auth-card-header">
    <h1 class="mb-md">{{ _('Two-factor authentication') }}</h1>
    <p class="text-muted">{{ _('Enter the 6-digit code from your authenticator app, or one of your recovery codes.') }}</p>
  </div>

  <div class="card">
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label for="code">{{ _('Code') }}</label>
        <input type="text" id="code" name="code" required autofocus autocomplete="one-time-code" inputmode="text" maxlength="32">
      </div>
      <button type="submit" class="btn btn-primary w-full mt-lg">{{ _('Verify') }}</button>
    </form>
    <p class="mt-lg"><a href="{{ url_for('auth.login') }}">{{ _('Start over') }}</a></p>
  </div>
</div>

{% endblock %}
