{% extends "base.html" %}
{% block title %}{{ _('Reset password') }} — mcprack{% endblock %}
{% block content %}

<div class="auth-card">
  <div class="auth-card-header">
    <h1 class="mb-md">{{ _('Choose a new password') }}</h1>
  </div>

  <div class="card">
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label for="new_password">{{ _('New password') }}</label>
        <input type="password" id="new_password" name="new_password" required autofocus>
      </div>
      <div class="form-group">
        <label for="confirm_password">{{ _('Confirm new password') }}</label>
        <input type="password" id="confirm_password" name="confirm_password" required>
      </div>
      <button type="submit" class="btn btn-primary w-full mt-lg">
        {{ _('Reset password') }}
      </button>
    </form>
  </div>
</div>

{% endblock %}
