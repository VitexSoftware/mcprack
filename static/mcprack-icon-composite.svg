<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <defs>
    <style>
      .mcp-admin { fill: #2563eb; }
      .mcp-users { fill: #16a34a; }
      .mcp-vault { fill: #9333ea; }
      .mcp-registry { fill: #ea580c; }
      .mcp-proxy { fill: #0891b2; }
      .mcp-center { fill: #1f2937; }
      .label-text { font-family: sans-serif; font-size: 10px; font-weight: bold; text-anchor: middle; fill: white; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="240" height="240" fill="#f9fafb" rx="12"/>

  <!-- Center: Main MCP Protocol Icon -->
  <g transform="translate(120, 120)">
    <!-- Main hexagon/shield representing MCP -->
    <polygon points="0,-45 39,-22.5 39,22.5 0,45 -39,22.5 -39,-22.5" class="mcp-center" opacity="0.1"/>
    <circle r="35" class="mcp-center" opacity="0.15"/>
    <text class="label-text" y="5" font-size="14">MCP</text>
  </g>

  <!-- Top-Left: Admin (Blue) -->
  <g transform="translate(60, 60)">
    <circle r="28" class="mcp-admin" opacity="0.9"/>
    <circle r="24" fill="none" stroke="white" stroke-width="2" opacity="0.4"/>
    <!-- Admin gear icon -->
    <circle r="8" cx="0" cy="0" fill="none" stroke="white" stroke-width="1.5"/>
    <g stroke="white" stroke-width="1.5" fill="none">
      <line x1="0" y1="-13" x2="0" y2="-16"/>
      <line x1="0" y1="13" x2="0" y2="16"/>
      <line x1="13" y1="0" x2="16" y2="0"/>
      <line x1="-13" y1="0" x2="-16" y2="0"/>
      <line x1="9" y1="9" x2="11" y2="11"/>
      <line x1="-9" y1="-9" x2="-11" y2="-11"/>
    </g>
    <text class="label-text" y="35" font-size="11">ADMIN</text>
  </g>

  <!-- Top-Right: User Catalog (Green) -->
  <g transform="translate(180, 60)">
    <circle r="28" class="mcp-users" opacity="0.9"/>
    <circle r="24" fill="none" stroke="white" stroke-width="2" opacity="0.4"/>
    <!-- Catalog/list icon -->
    <g stroke="white" stroke-width="1.5" fill="none">
      <rect x="-10" y="-12" width="20" height="4" rx="1"/>
      <rect x="-10" y="-4" width="20" height="4" rx="1"/>
      <rect x="-10" y="4" width="20" height="4" rx="1"/>
      <rect x="-10" y="12" width="20" height="4" rx="1"/>
    </g>
    <text class="label-text" y="35" font-size="11">CATALOG</text>
  </g>

  <!-- Bottom-Left: Vaultwarden (Purple) -->
  <g transform="translate(50, 180)">
    <circle r="28" class="mcp-vault" opacity="0.9"/>
    <circle r="24" fill="none" stroke="white" stroke-width="2" opacity="0.4"/>
    <!-- Lock/vault icon -->
    <g stroke="white" stroke-width="1.5" fill="none">
      <rect x="-8" y="-4" width="16" height="14" rx="1"/>
      <path d="M -6 -4 Q -6 -10 0 -10 Q 6 -10 6 -4" fill="none"/>
      <circle r="2" cx="0" cy="4"/>
    </g>
    <text class="label-text" y="35" font-size="11">VAULT</text>
  </g>

  <!-- Bottom-Center: Server Registry (Orange) -->
  <g transform="translate(120, 185)">
    <circle r="28" class="mcp-registry" opacity="0.9"/>
    <circle r="24" fill="none" stroke="white" stroke-width="2" opacity="0.4"/>
    <!-- Server/registry icon -->
    <g stroke="white" stroke-width="1.5" fill="none">
      <rect x="-10" y="-8" width="20" height="5" rx="1"/>
      <rect x="-10" y="-1" width="20" height="5" rx="1"/>
      <rect x="-10" y="6" width="20" height="5" rx="1"/>
      <circle r="1.5" cx="14" cy="-5.5" fill="white"/>
      <circle r="1.5" cx="14" cy="1.5" fill="white"/>
      <circle r="1.5" cx="14" cy="8.5" fill="white"/>
    </g>
    <text class="label-text" y="35" font-size="11">REGISTRY</text>
  </g>

  <!-- Bottom-Right: HTTP Proxy (Teal) -->
  <g transform="translate(190, 180)">
    <circle r="28" class="mcp-proxy" opacity="0.9"/>
    <circle r="24" fill="none" stroke="white" stroke-width="2" opacity="0.4"/>
    <!-- Network/proxy icon -->
    <g stroke="white" stroke-width="1.5" fill="none">
      <circle r="3" cx="-6" cy="-6"/>
      <circle r="3" cx="6" cy="-6"/>
      <circle r="3" cx="0" cy="8"/>
      <line x1="-6" y1="-3" x2="0" y2="5"/>
      <line x1="6" y1="-3" x2="0" y2="5"/>
    </g>
    <text class="label-text" y="35" font-size="11">PROXY</text>
  </g>

  <!-- Legend at bottom -->
  <text x="120" y="225" font-family="sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="500">
    Admin • Catalog • Vault • Registry • HTTP Proxy
  </text>
</svg>
