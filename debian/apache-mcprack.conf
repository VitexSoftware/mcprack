# Sample Apache reverse-proxy vhost for an internet-facing mcprack
# deployment. This file is NOT installed automatically by the .deb package
# (TLS certificate paths are inherently site-specific) - copy it to
# /etc/apache2/sites-available/mcprack.conf, adjust the placeholders below,
# then `a2ensite mcprack && a2enmod ssl proxy proxy_http headers && systemctl
# reload apache2`.
#
# --- Where gunicorn listens -------------------------------------------------
# gunicorn binds 127.0.0.1:8912 by default (GUNICORN_BIND in
# debian/mcprack.service), so Apache on this same host reaches it while the
# network cannot - nothing can bypass TLS and talk to gunicorn in plaintext,
# and no firewall rule is needed for that. If Apache runs on a DIFFERENT
# host you must widen the bind in /etc/mcprack/env, e.g.
# GUNICORN_BIND=0.0.0.0:8912, and then restrict the port yourself:
#   nft add rule inet filter input tcp dport 8912 ip saddr != <proxy-ip> drop
# or the equivalent ufw/iptables rule.
#
# --- Header responsibility split --------------------------------------------
# HSTS is set by both Apache (below) and Flask (app.py's after_request hook)
# as harmless defense-in-depth belt-and-suspenders - browsers just take
# whichever value they see, duplication doesn't sum or conflict. CSP,
# X-Frame-Options, X-Content-Type-Options, and Referrer-Policy are set by
# Flask ONLY (not duplicated here) since Flask is the single source of truth
# that's actually exercised by mcprack's own test suite - do not add a
# second, divergent CSP here.

<VirtualHost *:80>
    ServerName mcprack.example.com
    Redirect permanent / https://mcprack.example.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName mcprack.example.com

    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/mcprack.example.com/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/mcprack.example.com/privkey.pem
    # SSLCertificateChainFile is folded into fullchain.pem for certbot-issued
    # certs; set it separately here if your CA gives you a standalone chain.
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    # Run the resulting config through https://ssl-config.mozilla.org/ or
    # `sslscan mcprack.example.com` after deploying to confirm cipher choice.

    ProxyPreserveHost On
    ProxyPass        "/" "http://127.0.0.1:8912/"
    ProxyPassReverse "/" "http://127.0.0.1:8912/"

    # mod_proxy with ProxyPreserveHost On already forwards X-Forwarded-For/
    # -Host/-Server automatically. X-Forwarded-Proto is NOT inferred by
    # older mod_proxy versions, so set it explicitly:
    RequestHeader set X-Forwarded-Proto "https" env=HTTPS
    # If your Apache/mod_proxy version does NOT forward X-Forwarded-For on
    # its own, uncomment the mod_remoteip-based alternative instead:
    # RemoteIPHeader X-Forwarded-For
    # RequestHeader set X-Forwarded-For "%{REMOTE_ADDR}s"

    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

    ErrorLog  ${APACHE_LOG_DIR}/mcprack-error.log
    CustomLog ${APACHE_LOG_DIR}/mcprack-access.log combined
    # Complementary to, not a replacement for, mcprack's own audit_log_entries
    # table and gunicorn's --access-logfile/--error-logfile.
</VirtualHost>

# --- Alternative: mounting under a sub-path of an existing vhost -----------
# Root-mount (above) is the documented default. If mcprack instead needs to
# share a vhost you don't control the root of, add this block inside that
# vhost and set X-Forwarded-Prefix so wsgi.py's ProxyFix(x_prefix=1) rewrites
# SCRIPT_NAME - every url_for() call in the app already respects that, so
# no other change is needed:
#
#   ProxyPass        "/mcprack" "http://127.0.0.1:8912"
#   ProxyPassReverse "/mcprack" "http://127.0.0.1:8912"
#   RequestHeader set X-Forwarded-Prefix "/mcprack"
#   RequestHeader set X-Forwarded-Proto "https" env=HTTPS
