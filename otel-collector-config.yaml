# Optional standalone OTEL Collector config, used only when running
# docker-compose.otel.yml with `--profile collector`. By default mcprack's
# local dev stack points straight at Jaeger's own built-in OTLP receiver
# (simpler); this file is here for testing against a real
# Collector-in-front-of-a-backend topology, closer to how the shared
# 10.11.56.226 Grafana Alloy deployment is likely set up.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889
  debug:
    verbosity: detailed

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger, debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus, debug]
