[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcprack"
version = "1.2.2"
description = "Self-service MCP (Model Context Protocol) server catalog and client config generator"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Vitex Software", email = "info@vitexsoftware.cz" }]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "flask",
    "flask-sqlalchemy",
    "flask-login",
    "flask-migrate",
    "flask-wtf>=1.2.1",
    "flask-limiter>=3.5.0",
    "ldap3",
    "gunicorn",
    "fastmcp>=4.0.0a2",
    "flask-babel",
    "PyYAML",
]

[project.urls]
Homepage = "https://github.com/VitexSoftware/mcprack"
Repository = "https://github.com/VitexSoftware/mcprack"
Issues = "https://github.com/VitexSoftware/mcprack/issues"

[project.scripts]
mcprack = "mcprack.__main__:main"

[tool.setuptools]
packages = ["mcprack"]
include-package-data = true

[tool.setuptools.package-data]
mcprack = [
    "templates/**/*",
    "static/*",
    "translations/**/*.mo",
    "translations/**/*.po",
    "openapi/*.yaml",
    "migrations/*",
    "migrations/versions/*.py",
]
