{% extends "base.html" %}
{% block title %}{{ filename }} — mcprack{% endblock %}
{% block content %}
<h1>{{ filename }}</h1>
<p>Copy this into place yourself, or use the
<a href="{{ url_for('catalog.download', client=client) }}">file download</a> instead.</p>

<textarea id="config-json" rows="20" readonly onclick="this.select()">{{ config_json }}</textarea>
<p>
  <button type="button" id="copy-button" onclick="copyConfig()">Copy to clipboard</button>
  <span id="copy-status"></span>
</p>

<script>
  function copyConfig() {
    const textarea = document.getElementById("config-json");
    const status = document.getElementById("copy-status");

    function showCopied() {
      status.textContent = "Copied!";
      setTimeout(function () { status.textContent = ""; }, 2000);
    }

    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(textarea.value).then(showCopied, function () {
        fallbackCopy();
      });
    } else {
      fallbackCopy();
    }

    function fallbackCopy() {
      textarea.select();
      textarea.setSelectionRange(0, textarea.value.length);
      try {
        document.execCommand("copy");
        showCopied();
      } catch (err) {
        status.textContent = "Copy failed — select the text manually.";
      }
    }
  }
</script>

<p><a href="{{ url_for('catalog.index') }}">Back to catalog</a></p>
{% endblock %}
