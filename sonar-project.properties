sonar.organization=VitexSoftware
sonar.projectKey=VitexSoftware_mcprack
sonar.projectName=mcprack

sonar.sources=mcprack
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.python.version=3.9

# Generated or non-Python trees are not code under analysis - in particular
# alembic migrations only ever run upward, so their downgrade() bodies are
# excluded from coverage-on-new-code too.
sonar.exclusions=mcprack/migrations/**,mcprack/static/**,mcprack/templates/**,debian/**,deploy/**,doc/**,grafana/**,zabbix/**,dist/**,bin/**

# Produced by: pytest --cov=mcprack --cov-report=xml  (see requirements-dev.txt).
# SonarCloud's automatic analysis never runs the test suite, so without a
# coverage report from CI the "coverage on new code" measure stays at 0.0%.
sonar.python.coverage.reportPaths=coverage.xml
